<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f7f8f8" />
    <!-- publicScheduleRenderer가 이 문서를 골라 썼는지 확인하는 마커. firebase.json의
         catch-all rewrite("**" -> /index.html)는 public.html이 실제로 없어도 200과
         index.html을 돌려주므로, 상태 코드만으로는 올바른 문서가 왔는지 알 수 없다.
         렌더러는 이 마커 문자열의 존재로 판별한다 — 없으면 경고를 남기고 로그인
         엔트리를 대신 서빙한다. -->
    <meta name="gaplan-entry" content="public" />
    <!-- Google Fonts를 싣지 않는다. 이 문서는 렌더 블로킹 왕복 하나가 첫 표시를
         그대로 늦추는 자리라, 시스템 폰트 스택($font-family의 -apple-system 이하)으로
         간다. iOS는 SF Pro, 안드로이드는 Roboto로 떨어져 오히려 네이티브해 보인다.
         로그인 앱(index.html)은 Inter를 그대로 쓴다. -->
    <title>GA Plan 일정</title>
    <meta property="og:type" content="website" />
    <meta property="og:title" content="GA Plan 일정" />
    <meta property="og:description" content="지역 칠십인 일정" />
    <meta property="og:image" content="https://gaplan-fccfe.web.app/icon-512.png" />
    <meta property="og:image:width" content="512" />
    <meta property="og:image:height" content="512" />
    <meta property="og:url" content="https://gaplan-fccfe.web.app" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/public/main.tsx"></script>
  </body>
</html>
